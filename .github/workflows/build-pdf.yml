name: Build PDF

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install PT fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-paratype

      - name: Install pandoc
        run: |
          curl -sSL -o /tmp/pandoc.deb https://github.com/jgm/pandoc/releases/download/3.6.4/pandoc-3.6.4-1-amd64.deb
          sudo dpkg -i /tmp/pandoc.deb

      - name: Install typst
        uses: typst-community/setup-typst@v4

      - name: Build PDF
        run: make pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v6
        with:
          name: M17-Internet-Interface-PDF
          path: M17 Internet Interface.pdf

      - name: Attach PDF to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: M17 Internet Interface.pdf
